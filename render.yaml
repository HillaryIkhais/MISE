services:
  - type: web
    name: mise
    runtime: shell
    plan: free
    buildCommand: npm install --prefix web && npm run build --prefix web
    startCommand: python3 server.py --db contractor.db
    envVars:
      - key: CALLE_API_KEY
        sync: false
      - key: CALLE_BASE_URL
        sync: false
      - key: CALLE_PHONE
        sync: false
      - key: PORT
        value: 8080